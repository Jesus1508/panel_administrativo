<div class="max-w-3xl mx-auto px-4 py-12">
  @if (cargando()) {
    <p class="text-sm text-slate-400">Cargando…</p>
  } @else if (error() || !pagina()) {
    <p class="text-sm text-slate-400">Página no encontrada.</p>
  } @else {
    <h1 class="text-2xl font-bold text-slate-800 mb-6">{{ pagina()!.titulo }}</h1>
    <p class="whitespace-pre-line text-slate-600 leading-relaxed">{{ pagina()!.contenido }}</p>
  }
</div>

<div class="max-w-md mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">Contáctanos</h1>

  @if (enviado()) {
    <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg p-4">
      Gracias por tu mensaje, te responderemos pronto.
    </div>
  } @else {
    <form (ngSubmit)="enviar()" class="space-y-3">
      <input
        [(ngModel)]="nombre"
        name="nombre"
        required
        placeholder="Tu nombre"
        class="w-full p-2.5 border border-slate-300 rounded text-sm focus:outline-brand"
      />
      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        required
        placeholder="Tu correo electrónico"
        class="w-full p-2.5 border border-slate-300 rounded text-sm focus:outline-brand"
      />
      <textarea
        [(ngModel)]="mensaje"
        name="mensaje"
        required
        rows="4"
        placeholder="Tu mensaje"
        class="w-full p-2.5 border border-slate-300 rounded text-sm focus:outline-brand"
      ></textarea>
      <button
        type="submit"
        class="w-full bg-brand hover:bg-brand-dark text-white font-semibold py-2.5 rounded transition"
      >
        Enviar mensaje
      </button>
    </form>
  }
</div>

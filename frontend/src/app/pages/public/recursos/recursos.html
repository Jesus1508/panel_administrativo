<div class="max-w-3xl mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">Recursos y documentos</h1>

  @if (cargando()) {
    <p class="text-sm text-slate-400">Cargando…</p>
  } @else if (recursos().length === 0) {
    <p class="text-sm text-slate-400">Aún no hay recursos disponibles.</p>
  } @else {
    <div class="space-y-3">
      @for (recurso of recursos(); track recurso.id) {
        <a
          [href]="recurso.archivoUrl"
          target="_blank"
          class="flex items-center justify-between bg-white border border-slate-200 rounded-lg p-4 hover:border-brand/50 hover:shadow-sm transition-all"
        >
          <div>
            <p class="text-sm font-semibold text-slate-800">{{ recurso.titulo }}</p>
            <p class="text-xs text-slate-500">{{ recurso.descripcion }}</p>
            <span class="text-[10px] text-slate-400 uppercase">{{ recurso.categoria }}</span>
          </div>
          <span class="text-brand text-sm font-medium">Descargar ↓</span>
        </a>
      }
    </div>
  }
</div>

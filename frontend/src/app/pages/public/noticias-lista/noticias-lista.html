<div class="max-w-5xl mx-auto px-4 py-12">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">Noticias</h1>

  @if (cargando()) {
    <p class="text-sm text-slate-400">Cargando…</p>
  } @else if (noticias().length === 0) {
    <p class="text-sm text-slate-400">Aún no hay noticias publicadas.</p>
  } @else {
    <div class="grid md:grid-cols-3 gap-5">
      @for (noticia of noticias(); track noticia.slug) {
        <a
          [routerLink]="['/noticias', noticia.slug]"
          class="bg-white border border-slate-200 rounded-lg overflow-hidden hover:shadow-md hover:border-brand/50 transition-all"
        >
          @if (noticia.imagenUrl) {
            <img [src]="noticia.imagenUrl" [alt]="noticia.titulo" class="w-full h-36 object-cover" />
          }
          <div class="p-4">
            <h3 class="text-sm font-semibold text-slate-800 mb-1">{{ noticia.titulo }}</h3>
            <p class="text-xs text-slate-500 line-clamp-2">{{ noticia.resumen }}</p>
          </div>
        </a>
      }
    </div>
  }
</div>

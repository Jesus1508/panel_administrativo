<div>
  <h1 class="text-2xl font-serif font-semibold text-slate-800 mb-6">Recursos y documentos</h1>

  <form (ngSubmit)="guardar()" class="bg-white border border-slate-200 rounded-lg p-5 mb-6 space-y-3">
    <div class="grid md:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Título</label>
        <input
          [(ngModel)]="titulo"
          name="titulo"
          required
          class="w-full p-2 border border-slate-300 rounded text-sm focus:outline-brand"
        />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Categoría</label>
        <input
          [(ngModel)]="categoria"
          name="categoria"
          class="w-full p-2 border border-slate-300 rounded text-sm focus:outline-brand"
        />
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Descripción</label>
      <input
        [(ngModel)]="descripcion"
        name="descripcion"
        class="w-full p-2 border border-slate-300 rounded text-sm focus:outline-brand"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 mb-1">Archivo</label>
      <input type="file" required (change)="onArchivoSeleccionado($event)" class="text-sm" />
    </div>
    <button
      type="submit"
      [disabled]="guardando()"
      class="bg-brand hover:bg-brand-dark disabled:opacity-60 text-white text-sm font-semibold px-4 py-2 rounded transition"
    >
      Subir recurso
    </button>
  </form>

  @if (cargando()) {
    <p class="text-sm text-slate-400">Cargando…</p>
  } @else {
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <table class="w-full text-sm text-left">
        <thead class="bg-slate-50 text-xs uppercase text-slate-500">
          <tr>
            <th class="px-4 py-3">Título</th>
            <th class="px-4 py-3">Categoría</th>
            <th class="px-4 py-3">Archivo</th>
            <th class="px-4 py-3 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (recurso of recursos(); track recurso.id) {
            <tr class="border-t border-slate-100">
              <td class="px-4 py-3 font-medium text-slate-800">{{ recurso.titulo }}</td>
              <td class="px-4 py-3 text-slate-500">{{ recurso.categoria }}</td>
              <td class="px-4 py-3">
                <a [href]="recurso.archivoUrl" target="_blank" class="text-brand hover:underline">{{ recurso.archivoNombre }}</a>
              </td>
              <td class="px-4 py-3">
                <div class="flex justify-end">
                  <button (click)="eliminar(recurso)" class="text-slate-500 hover:text-red-600">Eliminar</button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

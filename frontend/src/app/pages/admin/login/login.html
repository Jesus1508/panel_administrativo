<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <form (ngSubmit)="iniciarSesion()" class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 w-full max-w-sm">
    <h1 class="text-xl font-bold text-brand text-center mb-6">Panel Administrativo</h1>

    <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
    <input
      [(ngModel)]="email"
      name="email"
      type="email"
      required
      class="w-full p-2.5 border border-slate-300 rounded mb-4 focus:outline-brand text-sm"
    />

    <label class="block text-sm font-medium text-slate-600 mb-1">Contraseña</label>
    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      required
      class="w-full p-2.5 border border-slate-300 rounded mb-4 focus:outline-brand text-sm"
    />

    @if (error()) {
      <p class="text-sm text-red-600 mb-4">{{ error() }}</p>
    }

    <button
      type="submit"
      [disabled]="cargando()"
      class="w-full bg-brand hover:bg-brand-dark disabled:opacity-60 text-white font-semibold py-2.5 rounded transition"
    >
      {{ cargando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</div>
